<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラウド画像保存サイト</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .upload-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      background-color: #fafafa;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    #statusMessage {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #666;
    }

    .gallery-area {
      margin-top: 30px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .gallery-area h3 {
      font-size: 1rem;
      color: #555;
      margin-bottom: 15px;
    }

    /* 画像一覧をグリッド状（並べて）表示するスタイル */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    .image-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="upload-container">
    <h2>画像をクラウドに保存</h2>
    
    <div class="file-input-wrapper">
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <button id="uploadBtn">クラウドに保存する</button>

    <p id="statusMessage"></p>

    <!-- 保存された画像の一覧表示エリア -->
    <div class="gallery-area">
      <h3>保存済み画像一覧</h3>
      <div id="imageGrid" class="image-grid"></div>
    </div>
  </div>

  <!-- Firebase JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL, listAll } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMLSWsVAtd0WHzw8xcCE3Lrmui4dCaYPQ",
      authDomain: "gazouhozon-8ffd1.firebaseapp.com",
      projectId: "gazouhozon-8ffd1",
      storageBucket: "gazouhozon-8ffd1.firebasestorage.app",
      messagingSenderId: "906533676912",
      appId: "1:906533676912:web:679a9f6bc94686a9cb91b5",
      measurementId: "G-J25SL6L8VY"
    };

    // Firebaseの初期化
    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    // DOM要素
    const imageInput = document.getElementById('imageInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMessage = document.getElementById('statusMessage');
    const imageGrid = document.getElementById('imageGrid');

    // 保存されている画像の一覧を取得して表示する関数
    async function loadImages() {
      imageGrid.innerHTML = ""; // 一旦リセット
      const listRef = ref(storage, 'images/');
      
      try {
        const res = await listAll(listRef);
        if (res.items.length === 0) {
          imageGrid.innerHTML = "<p style='color:#888; font-size:0.85rem;'>まだ画像はありません</p>";
          return;
        }

        // 各ファイルのダウンロードURLを取得してimgタグを作成
        for (const itemRef of res.items) {
          const url = await getDownloadURL(itemRef);
          const img = document.createElement('img');
          img.src = url;
          img.alt = "アップロード画像";
          imageGrid.appendChild(img);
        }
      } catch (error) {
        console.error("画像一覧の取得に失敗しました:", error);
      }
    }

    // ページ読み込み時に画像一覧を表示
    loadImages();

    // アップロード処理
    uploadBtn.addEventListener('click', () => {
      const file = imageInput.files[0];
      if (!file) {
        alert("画像を選択してください");
        return;
      }

      statusMessage.textContent = "アップロード中...";
      
      const storageRef = ref(storage, 'images/' + Date.now() + '_' + file.name);

      uploadBytes(storageRef, file).then(() => {
        statusMessage.textContent = "保存が完了しました！";
        imageInput.value = ""; // 入力欄をクリア
        loadImages(); // 画像一覧を再読み込み
      }).catch((error) => {
        console.error(error);
        statusMessage.textContent = "エラーが発生しました。Storageのルールを確認してください。";
      });
    });
  </script>

</body>
</html>
